name: Android 构建

on:
  push:
    tags: ['v*']      # 打 v1.0.0 这类 tag 触发
    branches: [main]   # main 分支也构建，便于验证
  workflow_dispatch:     # 支持手动触发

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: 安装 API 36 平台与构建工具
        run: sdkmanager "platforms;android-36" "platform-tools"

      - name: 验证 SDK 环境
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | grep -E "platforms;android-36" || \
            echo "⚠️ 未检测到 API 36，AGP 可能会自动下载"
          java -version

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 缓存 Android SDK
        uses: actions/cache@v4
        with:
          path: ~/.gradle/android-sdk
          key: sdk-${{ runner.os }}-${{ hashFiles('android/app/build.gradle') }}
          restore-keys: sdk-${{ runner.os }}-

      - name: 安装依赖
        run: npm ci

      - name: 同步 Web 资源（从真源拉最新线上代码）
        env:
          MXQ_WWW_REPO: ${{ vars.MXQ_SRC_REPO }}
          MXQ_WWW_PATH: ${{ vars.MXQ_SRC_PATH }}
        run: |
          bash scripts/sync-web-ci.sh

      # 先出 Debug APK：可直接安装测试，最快拿到能用的包
      - name: 构建 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mxq-store-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # Release 未签名包：出包慢且需另行签名，失败不影响 debug 结果
      - name: 构建 Release APK（未签名）
        working-directory: android
        continue-on-error: true
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: mxq-store-apk-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
          if-no-files-found: ignore