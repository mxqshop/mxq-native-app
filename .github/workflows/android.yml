name: Android 构建

on:
  push:
    tags: ['v*']      # 打 v1.0.0 这类 tag 触发
    branches: [main]   # main 分支也构建，便于验证
  workflow_dispatch:     # 支持手动触发

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 用于把 APK 发布到 Release（公开下载）

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 设置 JDK 21（Capacitor 8 要求 source/target 21）
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 设置 Android SDK 环境
        run: |
          # ubuntu-latest runner 自带 Android SDK，无需第三方 action
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "SDK 路径: $SDK"
          ls "$SDK" | head
          # 找sdkmanager（新版在 cmdline-tools 下）
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          echo "sdkmanager: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "SDK=$SDK" >> "$GITHUB_ENV"

      - name: 安装 API 36 平台与构建工具
        run: |
          if [ -z "$SDKMANAGER" ]; then
            echo "❌ 未找到 sdkmanager，无法安装平台"
            exit 1
          fi
          chmod +x "$SDKMANAGER" 2>/dev/null || true
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-36" || \
            "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-35"

      - name: 验证 SDK 环境
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1
          ls "$SDK/platforms" 2>/dev/null || echo "⚠️ 未发现 platforms 目录"

      - name: 缓存 Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 缓存 Android SDK
        uses: actions/cache@v5
        with:
          path: ~/.gradle/android-sdk
          key: sdk-${{ runner.os }}-${{ hashFiles('android/app/build.gradle') }}
          restore-keys: sdk-${{ runner.os }}-

      - name: 安装依赖
        run: npm install

      - name: 同步 Web 资源（从真源拉最新线上代码）
        env:
          MXQ_WWW_REPO: ${{ vars.MXQ_SRC_REPO }}
          MXQ_WWW_PATH: ${{ vars.MXQ_SRC_PATH }}
        run: |
          bash scripts/sync-web-ci.sh

      - name: 检查 Android 签名/Play 上传密钥是否已配置
        id: android-secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KS" ]; then echo "has_keystore=true" >> "$GITHUB_OUTPUT";
          else echo "has_keystore=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$PLAY" ]; then echo "has_play=true" >> "$GITHUB_OUTPUT";
          else echo "has_play=false" >> "$GITHUB_OUTPUT"; fi

      # 先出 Debug APK：可直接安装测试，最快拿到能用的包
      - name: 构建 Debug APK
        working-directory: android
        run: |
          # Gradle 版本/JVM 信息，便于排查
          ./gradlew --version 2>&1 | head -12
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: mxq-store-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # 发布到 Release：公开库附件可免令牌直接下载（绕开 artifact 接口鉴权限制）
      - name: 发布 Debug APK 到 Release（公开下载）
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-debug-latest --yes || true
          gh release create apk-debug-latest \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "MXQ Store APK (debug)" \
            --notes "自动构建 · App 端 9 处图片/API 同源修复（前台版本 20261011a）" \
            --prerelease

      # 有签名密钥时出正式签名 AAB（Play 商店要求 AAB）；否则仍出未签名 APK 供手动签名
      - name: 解码签名 Keystore
        if: steps.android-secrets.outputs.has_keystore == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 --decode > android/app/release-key.keystore
          echo "keystore 已就绪: $(ls -l android/app/release-key.keystore | awk '{print $5}') bytes"

      - name: 构建签名 AAB（release）
        if: steps.android-secrets.outputs.has_keystore == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/release-key.keystore
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: 上传签名 AAB
        if: steps.android-secrets.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: mxq-store-aab-signed
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

      # 未配置密钥时退回未签名 APK（不影响 debug 结果）
      - name: 构建 Release APK（未签名）
        if: steps.android-secrets.outputs.has_keystore == 'false'
        working-directory: android
        continue-on-error: true
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 Release APK（未签名）
        if: steps.android-secrets.outputs.has_keystore == 'false'
        uses: actions/upload-artifact@v5
        with:
          name: mxq-store-apk-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
          if-no-files-found: ignore

      # 上传到 Google Play（需配置 PLAY_SERVICE_ACCOUNT_JSON；默认进 internal 轨道）
      - name: 上传到 Google Play
        if: steps.android-secrets.outputs.has_play == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: to.mxqshop.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed